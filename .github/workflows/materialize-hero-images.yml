name: Materialize hero images

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-hero-images.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode hero WebP assets
        shell: python
        run: |
          import base64
          from pathlib import Path

          pairs = [
              ("hero-exact.b64.txt", "hero-desktop.webp"),
              ("hero-mobile.b64.txt", "hero-mobile.webp"),
          ]

          for source, target in pairs:
              encoded = "".join(Path(source).read_text(encoding="utf-8").split())
              raw = base64.b64decode(encoded, validate=True)
              if raw[:4] != b"RIFF" or raw[8:12] != b"WEBP":
                  raise RuntimeError(f"{source} is not a valid WebP payload")
              Path(target).write_bytes(raw)
              print(f"{target}: {len(raw)} bytes")

      - name: Commit real WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hero-desktop.webp hero-mobile.webp
          if git diff --cached --quiet; then
            echo "Hero files already up to date"
            exit 0
          fi
          git commit -m "Build real hero WebP assets"
          git push
