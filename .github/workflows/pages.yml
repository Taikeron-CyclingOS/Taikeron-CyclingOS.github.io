name: Deploy Taikeron website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Materialize exact Taikeron branding images
        shell: bash
        run: |
          tr -d '\r\n ' < logo-global-taikeron.b64.txt | base64 --decode > taikeron-global.jpg
          cat \
            logo-wordmark-prefix-1.b64.txt \
            logo-wordmark-prefix-2.b64.txt \
            logo-wordmark-prefix-3.b64.txt \
            logo-wordmark-prefix-4.b64.txt \
            logo-wordmark-prefix-5.b64.txt \
            logo-wordmark.b64.txt \
            | tr -d '\r\n ' \
            | base64 --decode > taikeron-wordmark.jpg
          test -s taikeron-global.jpg
          test -s taikeron-wordmark.jpg

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
