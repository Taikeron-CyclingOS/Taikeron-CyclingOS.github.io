name: Check TA build secrets once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-ta-build-secrets-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_TOKEN: ${{ secrets.TAIKERON_SITE_TOKEN }}
      KEYSTORE_B64: ${{ secrets.TAIKERON_ANDROID_KEYSTORE_B64 }}
      KEY_ALIAS: ${{ secrets.TAIKERON_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.TAIKERON_ANDROID_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.TAIKERON_ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check presence without exposing values
        shell: bash
        run: |
          : > TA_21029_SECRET_CHECK.txt
          for name in SITE_TOKEN KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -n "${!name}" ]; then echo "$name=present" >> TA_21029_SECRET_CHECK.txt; else echo "$name=absent" >> TA_21029_SECRET_CHECK.txt; fi
          done
      - name: Save report
        run: |
          git config user.name 'Taikeron Build Probe'
          git config user.email 'taikeron.cyclingos@gmail.com'
          git add TA_21029_SECRET_CHECK.txt
          git commit -m 'chore: report TA build secret availability'
          git push origin main
